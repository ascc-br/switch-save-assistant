name: Build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./SwitchSaveAssistant.slnx
      - name: Build
        run: dotnet build ./SwitchSaveAssistant.slnx --configuration Release --no-restore -warnaserror
      - name: Test
        run: dotnet test ./SwitchSaveAssistant.Tests/SwitchSaveAssistant.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory ./TestResults
